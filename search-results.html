<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senvia — Search Results</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#17324d}.top{background:#0b3154;color:#fff;padding:10px 5%;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.head{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 25px #00000012;margin-bottom:18px}.head h1{margin:0 0 8px;font-size:25px}.filters{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#eef5ff;border-radius:20px;padding:8px 12px;font-size:13px}.back{display:inline-block;text-decoration:none;background:#0b6fbf;color:#fff;padding:10px 16px;border-radius:10px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 7px 22px #00000010}.avatar{width:48px;height:48px;border-radius:50%;background:#e8f3ff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0b6fbf}.prohead{display:flex;gap:12px;align-items:center}.card h3{margin:0 0 5px}.muted{color:#68798a;font-size:13px}.empty{text-align:center;background:#fff;border-radius:16px;padding:35px;box-shadow:0 7px 22px #00000010}.loading{text-align:center;padding:40px}@media(max-width:750px){.grid{grid-template-columns:1fr}.head h1{font-size:21px}}</style></head><body><div class="top">📍 Muzaffarpur, Bihar</div><main class="wrap"><div class="head"><h1>🔎 Senvia Professional Search</h1><div class="filters" id="filters"></div><a class="back" href="customer-premium.html">← Home पर वापस जाएँ</a></div><div id="result" class="loading">Searching…</div></main><script>
const URL='https://hxdrvhiowurbwlgmczju.supabase.co',KEY='sb_publishable_cvh_b0gklN5SOcH5MsGs8g_4JI9-PxT',API=URL+'/rest/v1/',H={apikey:KEY,'Content-Type':'application/json'};
const q=new URLSearchParams(location.search);const wanted={block:(q.get('block')||'').trim(),panchayat:(q.get('panchayat')||'').trim(),pin:(q.get('pin')||'').replace(/\D/g,''),service:(q.get('service')||'').trim()};
const norm=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,' ');const val=(o,keys,d='')=>{for(const k of keys){if(o&&o[k]!=null&&String(o[k]).trim())return String(o[k]).trim()}return d};
const serviceNorm=v=>norm(v).replace(/repair/g,'').replace(/professional/g,'').trim();
const match=(a,b)=>{if(!b)return true;const A=norm(a),B=norm(b);return A===B||A.includes(B)||B.includes(A)};
function serviceMatch(p,selected){if(!selected)return true;const s=serviceNorm(selected);return (p.services||[]).some(x=>{const q=serviceNorm(x);return q===s||q.includes(s)||s.includes(q)||(s.includes('ac')&&q.includes('ac'))||(s.includes('fridge')&&(q.includes('fridge')||q.includes('refrigerator')))||(s.includes('mobile')&&q.includes('mobile'))||(s.includes('computer')&&(q.includes('computer')||q.includes('laptop')))});}
function verified(v){return ['verified','approve','approved'].includes(norm(v));}
async function load(){const r=await fetch(API+'professionals?select=*&limit=2000',{headers:H});if(!r.ok)throw new Error(await r.text());const data=await r.json();return data.map(x=>({name:val(x,['Name','name','full_name'],'Professional'),mobile:val(x,['Phone','phone','mobile','Mobile','Contact']),block:val(x,['Block','block']),panchayat:val(x,['Panchayat','panchayat','panchayat_name','area']),village:val(x,['Village_Area','Village','village','village_area','village_name']),pin:val(x,['PIN_Code','pin_code','PIN','pincode','Pin_Code']),services:val(x,['Services','services','service','service_name'],'').split(/[,|•]/).map(s=>s.trim()).filter(Boolean),status:val(x,['Status','status','verification_status'])}));}
function render(rows){const el=document.getElementById('result');if(!rows.length){el.innerHTML='<div class="empty"><h2>कोई Verified Professional नहीं मिला</h2><p class="muted">कृपया Block, Panchayat, PIN Code या Service बदलकर फिर खोजें।</p></div>';return;}el.className='grid';el.innerHTML=rows.map(p=>{const initials=p.name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();return `<div class="card"><div class="prohead"><div class="avatar">${initials}</div><div><h3>${p.name}</h3><div class="muted">${p.services.join(' • ')}</div></div></div><p>📍 ${p.block||'—'}${p.panchayat?' → '+p.panchayat:''}${p.village?' → '+p.village:''}</p><p>📮 PIN Code: ${p.pin||'—'}</p><div class="muted">Contact details are available through the Request Service registration flow.</div></div>`}).join('');}
(async()=>{const f=document.getElementById('filters');[['Block',wanted.block],['Panchayat',wanted.panchayat],['PIN Code',wanted.pin],['Service',wanted.service]].forEach(([k,v])=>{if(v)f.innerHTML+=`<span class="pill">${k}: ${v}</span>`});try{const all=await load();const rows=all.filter(p=>verified(p.status)).filter(p=>match(p.block,wanted.block)&&match(p.panchayat,wanted.panchayat)&&match(p.pin,wanted.pin)&&serviceMatch(p,wanted.service));render(rows);}catch(e){document.getElementById('result').innerHTML='<div class="empty"><h2>Search अभी उपलब्ध नहीं है</h2><p class="muted">Database से professionals लोड नहीं हो सके।</p></div>';console.error(e)}})();
</script></body></html>
